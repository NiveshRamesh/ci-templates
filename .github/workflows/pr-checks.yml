# =============================================================================
# Reusable PR security gate ("shift-left" checks). Nothing is built or deployed.
#
# Called from every service repo on pull_request. Order of checks:
#   1. Governance      - PR title has Jira ID, source branch allowed, branch up to date
#   2. Secret scan     - Gitleaks over the PR commit range
#   3. SAST            - Semgrep (all languages) + CodeQL (per language)
#   4. SCA + licences  - Trivy fs: block only NEW fixable HIGH/CRITICAL; Dependency Review: licences
#   5. IaC / config    - Hadolint (Dockerfile), Trivy config, zizmor (workflows)
#   6. Tests           - unit tests + coverage threshold
#   7. Quality gate    - SonarQube/SonarCloud: separate reusable workflow, sonar.yml
#   8. PR Gate         - single required status check that aggregates all of the above
#
# Make ONLY "pr-checks / PR Gate" a required status check in the branch ruleset.
# =============================================================================
name: PR Checks

on:
  workflow_call:
    inputs:
      language:
        description: "python | go | node | dotnet"
        type: string
        required: true
      language-version:
        description: "Toolchain version (e.g. 3.13, 1.27, 24, 9.0.x). Empty = read from go.mod / default."
        type: string
        default: ""
      install-command:
        description: "Command that installs dependencies before tests"
        type: string
        default: ""
      test-command:
        description: "Command that runs the unit tests (and fails under the coverage threshold)"
        type: string
        required: true
      codeql-languages:
        description: 'JSON list for CodeQL, e.g. ["python"], ["go"], ["javascript-typescript"], ["csharp"]. "[]" disables CodeQL.'
        type: string
        default: "[]"
      dockerfile:
        type: string
        default: Dockerfile
      fail-severity:
        description: "Lowest severity that blocks the PR for SCA findings it introduces (HIGH or CRITICAL)"
        type: string
        default: HIGH

permissions: {}

env:
  GITLEAKS_VERSION: "8.30.1"
  SEMGREP_IMAGE: "semgrep/semgrep:1.183.0"
  ZIZMOR_VERSION: "1.31.1"
  # Mirror first: ghcr.io rate-limits anonymous Trivy DB downloads.
  TRIVY_DB_REPOSITORY: "public.ecr.aws/aquasecurity/trivy-db:2,ghcr.io/aquasecurity/trivy-db:2"

jobs:
  # ---------------------------------------------------------------------------
  governance:
    name: Governance
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: PR title, source branch and freshness
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          JIRA_RE='[A-Z][A-Z0-9]+-[0-9]+'

          if [[ "$HEAD_REF" == dependabot/* ]]; then
            echo "Dependabot PR - Jira/branch rules skipped."
            exit 0
          fi

          # 1. PR title must carry a Jira ID (it becomes the squash-commit message,
          #    which is how the develop/release build finds the ticket).
          if [[ ! "$PR_TITLE" =~ $JIRA_RE ]]; then
            echo "::error::PR title must contain a Jira ID, e.g. 'CCBD-1234: Add login audit'. Got: '$PR_TITLE'"
            exit 1
          fi

          # 2. Allowed source -> target combinations (see Unified Branching model).
          ok=false
          case "$BASE_REF" in
            develop)
              [[ "$HEAD_REF" =~ ^feature/${JIRA_RE}$ || "$HEAD_REF" =~ ^hotfix/${JIRA_RE}$ || "$HEAD_REF" =~ ^release/[0-9]+\.[0-9]+$ ]] && ok=true ;;
            release/*)
              [[ "$HEAD_REF" =~ ^hotfix/${JIRA_RE}$ || "$HEAD_REF" =~ ^feature/${JIRA_RE}$ ]] && ok=true ;;
          esac
          if [[ "$ok" != true ]]; then
            echo "::error::Branch '$HEAD_REF' may not be merged into '$BASE_REF'. Use feature/<JIRA-ID> -> develop or hotfix/<JIRA-ID> -> release/<x.y>."
            exit 1
          fi

          # 3. Branch must contain the latest target branch (org pre-merge check).
          if ! git merge-base --is-ancestor "origin/$BASE_REF" "$HEAD_SHA"; then
            echo "::error::'$HEAD_REF' is behind '$BASE_REF'. Run: git fetch && git merge origin/$BASE_REF (or rebase), then push."
            exit 1
          fi
          echo "Governance checks passed."

  # ---------------------------------------------------------------------------
  secret-scan:
    name: Secret scan (Gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Gitleaks (checksum verified)
        run: |
          set -euo pipefail
          V="$GITLEAKS_VERSION"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${V}"
          curl -sSfLO "$base/gitleaks_${V}_linux_x64.tar.gz"
          curl -sSfLO "$base/gitleaks_${V}_checksums.txt"
          grep " gitleaks_${V}_linux_x64.tar.gz\$" "gitleaks_${V}_checksums.txt" | sha256sum -c -
          tar -xzf "gitleaks_${V}_linux_x64.tar.gz" gitleaks
          sudo mv gitleaks /usr/local/bin/

      - name: Scan commits in this PR
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gitleaks git . --log-opts="origin/${BASE_REF}..${HEAD_SHA}" \
            --redact --verbose --exit-code 1 \
            --report-format sarif --report-path gitleaks.sarif

      - name: Upload SARIF
        if: always() && hashFiles('gitleaks.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: gitleaks.sarif
          category: secrets

  # ---------------------------------------------------------------------------
  sast-semgrep:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Semgrep scan
        run: |
          docker run --rm -v "$PWD:/src" -w /src "$SEMGREP_IMAGE" \
            semgrep scan --metrics=off \
              --config p/default --config p/owasp-top-ten --config p/secrets \
              --sarif --output semgrep.sarif

      - name: Upload SARIF
        if: always() && hashFiles('semgrep.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep.sarif
          category: semgrep

      - name: Gate on ERROR-severity findings
        run: |
          # Semgrep puts the severity on the rule (defaultConfiguration.level), not on
          # each result, so resolve it per result before filtering.
          # shellcheck disable=SC2016 # $lvl is a jq variable, not a shell one
          errors='[.runs[] | ((.tool.driver.rules // []) | map({(.id): (.defaultConfiguration.level // "warning")}) | add // {}) as $lvl
                   | .results[] | select((.level // $lvl[.ruleId] // "warning") == "error")]'
          n=$(jq "$errors | length" semgrep.sarif)
          echo "Semgrep ERROR findings: $n"
          if [[ "$n" -gt 0 ]]; then
            jq -r "$errors"' | .[] | "\(.locations[0].physicalLocation.artifactLocation.uri):\(.locations[0].physicalLocation.region.startLine)  \(.ruleId)"' semgrep.sarif
            echo "::error::Semgrep found $n blocking issue(s). See the Security tab or the list above."
            exit 1
          fi

  # ---------------------------------------------------------------------------
  sast-codeql:
    name: SAST (CodeQL ${{ matrix.language }})
    if: inputs.codeql-languages != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(inputs.codeql-languages) }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        if: matrix.language == 'go'
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          # Go has no "none" mode; everything else can be analysed without a build.
          build-mode: ${{ matrix.language == 'go' && 'autobuild' || 'none' }}
          queries: security-extended

      - uses: github/codeql-action/analyze@v4
        with:
          category: codeql-${{ matrix.language }}

  # ---------------------------------------------------------------------------
  sca:
    name: SCA & licences
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Dependency Review (licences of dependencies added in this PR)
        uses: actions/dependency-review-action@v5
        with:
          # Vulnerabilities are gated by the Trivy comparison below, which honours
          # .trivyignore.yaml exceptions; this action only enforces the licence policy.
          vulnerability-check: false
          license-check: true
          comment-summary-in-pr: on-failure
          deny-licenses: AGPL-1.0-only, AGPL-3.0-only, AGPL-3.0-or-later, SSPL-1.0

      - name: Check out the target branch (baseline for the comparison)
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .base
          persist-credentials: false

      - uses: aquasecurity/setup-trivy@v0.3.1
        with:
          version: "v0.76.1"
          cache: true

      - name: Trivy fs - report (all severities)
        run: trivy fs --scanners vuln,license --skip-dirs .base --format sarif --output trivy-fs.sarif .

      - name: Upload SARIF
        if: always() && hashFiles('trivy-fs.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

      # Block only what this PR introduces: scan the PR and its target branch, compare.
      # Findings already on the target branch are tracked by the nightly scan instead.
      - name: Trivy fs - gate (new ${{ inputs.fail-severity }}+ findings only)
        env:
          SEVERITIES: ${{ inputs.fail-severity == 'CRITICAL' && 'CRITICAL' || 'HIGH,CRITICAL' }}
          HEAD_JSON: trivy-head.json
          BASE_JSON: trivy-base.json
          BASE_LABEL: target branch ${{ github.base_ref }}
          TITLE: Dependency vulnerabilities introduced by this PR
          NO_BASE: "0"
        run: |
          set -euo pipefail
          ignore=()
          [[ -f .trivyignore.yaml ]] && ignore=(--ignorefile .trivyignore.yaml)
          trivy fs --quiet --scanners vuln --severity "$SEVERITIES" "${ignore[@]}" --skip-dirs .base --format json --output "$HEAD_JSON" .
          trivy fs --quiet --scanners vuln --severity "$SEVERITIES" "${ignore[@]}" --format json --output "$BASE_JSON" .base
          # Expired exceptions do not block here (after a merge the finding is in the baseline).
          # They warn on every run; the release gate refuses releases with overdue exceptions.
          if [[ -f .trivyignore.yaml ]]; then
            # shellcheck disable=SC2016 # $today / $head / $ids / $id are jq variables
            yq -o=json '.vulnerabilities // []' .trivyignore.yaml \
              | jq -r --arg today "$(date -u +%F)" --slurpfile head "$HEAD_JSON" '
                  ($head[0] | [.Results[]?.Vulnerabilities[]?.VulnerabilityID]) as $ids
                  | .[] | .id as $id
                  | select(.expired_at != null and (.expired_at | tostring) < $today and any($ids[]; . == $id))
                  | "::warning::Exception for \(.id) in .trivyignore.yaml expired on \(.expired_at) and the finding is still present. Fix it or renew the exception. \(.statement // "")"'
          fi
          # shellcheck disable=SC2016 # $base / $old / $k are jq variables
          new_json=$(jq --slurpfile base "$BASE_JSON" 'def vulns: [.Results[]? as $t | $t.Vulnerabilities[]? | {id: .VulnerabilityID, pkg: .PkgName, sev: .Severity, installed: .InstalledVersion, fixed: (.FixedVersion // ""), target: $t.Target}];
          ($base[0] | vulns | map(.id + "|" + .pkg)) as $old
          | [vulns[] | select((.id + "|" + .pkg) as $k | any($old[]; . == $k) | not)]
          | unique_by(.id + "|" + .pkg)
          | map(. + {blocking: (.fixed != "" or (.sev == "CRITICAL" and env.NO_BASE != "1"))})' "$HEAD_JSON")
          total_head=$(jq '[.Results[]?.Vulnerabilities[]?] | length' "$HEAD_JSON")
          n_new=$(jq 'length' <<<"$new_json")
          n_block=$(jq '[.[] | select(.blocking)] | length' <<<"$new_json")
          {
            echo "### $TITLE"
            echo "Baseline: $BASE_LABEL"
            echo "- HIGH/CRITICAL findings now: $total_head (already present before this change are not blocking)"
            echo "- New with this change: $n_new, blocking: $n_block"
            if [[ "$n_new" -gt 0 ]]; then
              echo
              echo "| Blocks | Severity | CVE | Package | Installed | Fixed in | Target |"
              echo "| --- | --- | --- | --- | --- | --- | --- |"
              jq -r '.[] | "| \(if .blocking then "yes" else "no" end) | \(.sev) | \(.id) | \(.pkg) | \(.installed) | \(if .fixed == "" then "no fix yet" else .fixed end) | \(.target) |"' <<<"$new_json"
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"
          if [[ "$n_block" -gt 0 ]]; then
            echo "::error::$n_block new vulnerability finding(s) introduced by this change. Upgrade to the fixed version, or record an exception with an expiry date in .trivyignore.yaml."
            exit 1
          fi

  # ---------------------------------------------------------------------------
  iac:
    name: IaC & config scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Hadolint (Dockerfile best practice)
        if: hashFiles(inputs.dockerfile) != ''
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: ${{ inputs.dockerfile }}
          failure-threshold: error

      - uses: aquasecurity/setup-trivy@v0.3.1
        with:
          version: "v0.76.1"
          cache: true

      - name: Trivy config (Dockerfile, K8s, Helm, Terraform misconfig)
        run: trivy config --severity HIGH,CRITICAL --exit-code 1 .

      - name: zizmor (GitHub Actions workflow security)
        run: |
          cfg=()
          [[ -f .github/zizmor.yml ]] && cfg=(--config .github/zizmor.yml)
          pipx run "zizmor==${ZIZMOR_VERSION}" "${cfg[@]}" --offline --min-severity high .github/workflows

  # ---------------------------------------------------------------------------
  tests:
    name: Unit tests & native audit (${{ inputs.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - if: inputs.language == 'python'
        uses: actions/setup-python@v7
        with:
          python-version: ${{ inputs.language-version || '3.13' }}
      - if: inputs.language == 'go'
        uses: actions/setup-go@v7
        with:
          go-version: ${{ inputs.language-version }}
          go-version-file: ${{ inputs.language-version == '' && 'go.mod' || '' }}
      - if: inputs.language == 'node'
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.language-version || '24' }}
      - if: inputs.language == 'dotnet'
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ inputs.language-version || '9.0.x' }}

      - name: Install dependencies
        if: inputs.install-command != ''
        env:
          INSTALL_COMMAND: ${{ inputs.install-command }}
        run: bash -euo pipefail -c "$INSTALL_COMMAND"

      - name: Run tests
        env:
          TEST_COMMAND: ${{ inputs.test-command }}
        run: bash -euo pipefail -c "$TEST_COMMAND"

      # Ecosystem-native audit (govulncheck is reachability-aware). Reported as a warning,
      # not blocking: it cannot tell findings this PR introduced from existing ones, and
      # the Trivy comparison in the SCA job is the single blocking vulnerability gate.
      - name: Native dependency audit (report only)
        env:
          LANGUAGE: ${{ inputs.language }}
        run: |
          set -uo pipefail
          audit() {
          case "$LANGUAGE" in
            python) pipx run pip-audit==2.10.1 -r requirements.txt --strict ;;
            go)     go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./... ;;
            node)   npm audit --omit=dev --audit-level=high ;;
            dotnet)
              dotnet list package --vulnerable --include-transitive | tee audit.txt
              ! grep -q "has the following vulnerable packages" audit.txt ;;
            *) echo "No native audit for '$LANGUAGE'" ;;
          esac
          }
          if ! audit; then
            echo "::warning::The $LANGUAGE audit reports known vulnerabilities (see the log). Not blocking: new findings are gated by 'SCA & licences', existing ones are tracked by the nightly scan."
          fi

  # ---------------------------------------------------------------------------
  gate:
    name: PR Gate
    if: always()
    needs: [governance, secret-scan, sast-semgrep, sast-codeql, sca, iac, tests]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: All required checks passed?
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          bad=$(echo "$NEEDS" | jq '[.[] | select(.result == "failure" or .result == "cancelled")] | length')
          if [[ "$bad" -gt 0 ]]; then
            echo "::error::$bad check(s) failed. The PR cannot be merged."
            exit 1
          fi
