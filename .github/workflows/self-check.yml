# The pipeline that protects every service must itself be reviewed and linted.
name: Self check

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  lint:
    name: Lint workflows
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -color
      - name: zizmor (workflow security)
        run: pipx run zizmor==1.31.1 --config .github/zizmor.yml --offline --min-severity medium .github/workflows
